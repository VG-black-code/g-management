name: smartify_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  http: ^1.6.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  path: ^1.9.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  data_table_2: ^2.5.10
  google_fonts: ^6.2.1
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  video_player: ^2.8.1
  chewie: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/LOGO.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/LOGO.png"

flutter:
  uses-material-design: true
  assets:
    - assets/LOGO.png
